name: Publier le site MNPC-SABOUWA

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:

      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Preparer le site
        run: |
          mkdir -p public
          cp -r website/* public/

      - name: Televerser le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4