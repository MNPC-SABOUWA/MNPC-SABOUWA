name: mnpc_sabouwa

description: Application officielle MNPC SABOUWA.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  go_router: ^17.5.0
  flutter_secure_storage: 9.2.4
  qr_flutter: ^4.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: true
  ios: true
  min_sdk_android: 21
  image_path: "assets/images/mnpc_logo.jpg"


flutter:

  uses-material-design: true

  assets:
    - assets/images/mnpc_logo.jpg